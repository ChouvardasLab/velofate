# Conda environment for velofate (Linux).
# From the repository root:
#   conda env create -f environment.yml
#   conda activate velofate
#
# Conda provides Python and the PETSc/SLEPc solvers (which pip cannot build);
# everything else is installed by pip from the pinned requirements.txt.
name: velofate
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # numpy is pinned here too so conda and pip agree on one version
  - numpy=2.2.6
  - mpi4py=4.1.1
  - petsc4py=3.25.0
  - slepc4py=3.25.0
  - pip:
      - -r requirements.txt
      - -e .
